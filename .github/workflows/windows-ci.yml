name: Windows CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and regression checks
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build Debug x64
        shell: pwsh
        run: .\Build-Redux.ps1 -Configuration Debug

      - name: Verify native host output
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.\bin\Debug\Ijwhost.dll')) {
            throw 'The required C++/CLI native host output is missing.'
          }

      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          $audit = dotnet list '.\tests\Redux.Core.Tests\Redux.Core.Tests.csproj' package --vulnerable --include-transitive
          $audit | Write-Host
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($audit -match 'has the following vulnerable packages') {
            throw 'NuGet reported one or more vulnerable dependencies.'
          }

      - name: Run Redux regression checks
        shell: pwsh
        run: |
          & '.\tests\Redux.Core.Tests\bin\x64\Debug\net8.0-windows10.0.22621.0\Redux.Core.Tests.exe'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Test experimental Linux forwarding helper
        shell: pwsh
        run: python -m unittest discover -s tests/linux -v

      - name: Build and validate Publish package
        shell: pwsh
        run: |
          .\Build-Redux.ps1 -Configuration Publish
          $versionedArchive = Get-ChildItem -LiteralPath '.' -Filter 'BG3ModManager-Redux_v*.zip' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $versionedArchive) {
            throw 'The versioned Publish archive was not created.'
          }
          if (-not (Test-Path -LiteralPath '.\BG3ModManager-Redux-Latest.zip')) {
            throw 'The latest Publish archive was not created.'
          }
          $updateManifestPath = '.\Redux-Update-Public-Alpha.json'
          if (-not (Test-Path -LiteralPath $updateManifestPath)) {
            throw 'The public-alpha update manifest was not created.'
          }
          $updateManifest = Get-Content -LiteralPath $updateManifestPath -Raw | ConvertFrom-Json
          if ($updateManifest.schemaVersion -ne 1 -or $updateManifest.channel -ne 'public-alpha') {
            throw 'The public-alpha update manifest has an unsupported contract.'
          }
          $portableArtifact = @($updateManifest.artifacts) |
            Where-Object { $_.kind -eq 'portable' } |
            Select-Object -First 1
          if (-not $portableArtifact) {
            throw 'The public-alpha update manifest is missing its portable artifact.'
          }
          if ($portableArtifact.sizeBytes -ne $versionedArchive.Length) {
            throw 'The public-alpha update manifest contains the wrong archive length.'
          }
          $archiveHash = (Get-FileHash -LiteralPath $versionedArchive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($portableArtifact.sha256 -ne $archiveHash) {
            throw 'The public-alpha update manifest contains the wrong archive SHA-256.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($versionedArchive.FullName)
          try {
            $entries = $archive.Entries.FullName
            foreach ($required in @(
              'Redux.exe',
              'Redux.dll',
              'Redux-Release-Files.json',
              'Updater/ReduxUpdater.exe',
              'Updater/ReduxUpdater.dll',
              'Updater/ReduxUpdater.deps.json',
              'Updater/ReduxUpdater.runtimeconfig.json',
              '_Lib/LSLib.dll',
              '_Lib/LSLibNative.dll',
              '_Lib/Ijwhost.dll',
              'LICENSE',
              'README.md',
              'THIRD-PARTY-NOTICES.md'
            )) {
              if ($required -notin $entries) {
                throw "Required package entry is missing: $required"
              }
            }
            $inventoryEntry = $archive.GetEntry('Redux-Release-Files.json')
            $reader = [System.IO.StreamReader]::new($inventoryEntry.Open())
            try {
              $inventory = $reader.ReadToEnd() | ConvertFrom-Json
            }
            finally {
              $reader.Dispose()
            }
            if ($inventory.schemaVersion -ne 1) {
              throw 'The release file inventory has an unsupported contract.'
            }
            if (@($inventory.files).Count -ne @($entries).Count) {
              throw 'The release file inventory does not cover the complete archive.'
            }
            foreach ($entry in $entries) {
              if ($entry -notin @($inventory.files)) {
                throw "Archive entry is not owned by the release inventory: $entry"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload portable test build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: Redux-portable-${{ github.ref_name }}-${{ github.run_number }}
          path: BG3ModManager-Redux_v*.zip
          if-no-files-found: error
          retention-days: 7
